{% extends 'base.html' %}
{% block title %}Movimentar {{ variant.display_name }}{% endblock %}{% block page_title %}Movimentar estoque{% endblock %}
{% block content %}<form class="panel form-panel form-narrow" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="item-summary"><span><small>{{ variant.product.category.name }}</small><strong>{{ variant.display_name }}</strong></span><span><small>Saldo atual</small><strong class="stock-number">{{ variant.current_quantity }}</strong></span></div><div class="form-stack"><label class="field">Tipo *<select name="movement_type" required><option value="entry">Entrada / compra recebida</option><option value="return">Devolução ao estoque</option><option value="adjustment_add">Ajuste positivo</option><option value="adjustment_remove">Ajuste negativo</option></select></label><label class="field">Quantidade *<input type="number" name="quantity" min="1" required inputmode="numeric"></label><label class="field">Motivo *<textarea name="reason" rows="3" required maxlength="255" placeholder="Ex.: Nota fiscal 1234, devolução sem uso, inventário físico"></textarea></label></div><div class="form-actions"><a class="btn btn-secondary" href="{{ url_for('inventory.detail', variant_id=variant.id) }}">Cancelar</a><button class="btn btn-primary">Registrar movimentação</button></div></form>{% endblock %}
