{% extends 'base.html' %}{% block title %}{{ 'Editar usuário' if editing else 'Novo usuário' }}{% endblock %}{% block page_title %}{{ 'Editar usuário' if editing else 'Novo usuário' }}{% endblock %}
{% block content %}<form class="panel form-panel form-narrow" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-stack"><label class="field">Nome completo *<input name="full_name" required maxlength="160" value="{{ request.form.get('full_name', user.full_name or '') }}"></label><label class="field">Usuário *<input name="username" required maxlength="80" autocapitalize="none" autocomplete="off" value="{{ request.form.get('username', user.username or '') }}"></label><label class="field">E-mail<input type="email" name="email" maxlength="255" value="{{ request.form.get('email', user.email or '') }}"></label><label class="field">Perfil *<select name="role"><option value="admin" {{ 'selected' if request.form.get('role', user.role) == 'admin' }}>Administrador</option><option value="operator" {{ 'selected' if request.form.get('role', user.role) == 'operator' }}>Operador</option><option value="viewer" {{ 'selected' if request.form.get('role', user.role) == 'viewer' }}>Somente consulta</option></select></label><label class="field">{{ 'Nova senha (deixe em branco para manter)' if editing else 'Senha *' }}<input type="password" name="password" minlength="10" {{ 'required' if not editing }} autocomplete="new-password"><small>Mínimo de 10 caracteres.</small></label><label class="check-field"><input type="checkbox" name="is_active" {{ 'checked' if request.form.get('is_active') == 'on' or (not request.form and user.is_active_account) }}> Usuário ativo</label></div><div class="form-actions"><a class="btn btn-secondary" href="{{ url_for('admin.index') }}">Cancelar</a><button class="btn btn-primary">Salvar usuário</button></div></form>{% endblock %}
