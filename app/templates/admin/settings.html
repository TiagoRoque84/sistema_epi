{% extends 'base.html' %}{% block title %}Configurações{% endblock %}{% block page_title %}Configurações{% endblock %}
{% block content %}<form class="panel form-panel" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="section-heading"><div><p class="eyebrow">Alertas</p><h2>E-mail e comprovante</h2></div><p>A senha do Gmail não é armazenada nesta tela; ela fica protegida nas variáveis do servidor.</p></div><div class="form-stack"><label class="field">E-mail que receberá alertas *<input type="email" name="alert_email" required value="{{ request.form.get('alert_email', alert_address) }}"></label><label class="field">Termo de recebimento *<textarea name="acknowledgement_text" rows="8" required maxlength="5000">{{ request.form.get('acknowledgement_text', acknowledgement) }}</textarea><small>O termo inclui referência à NR-6. Uma cópia deste texto é gravada em cada nova entrega, preservando o que foi aceito na data. Consulte a <a class="text-link" href="https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadora/normas-regulamentadoras-vigentes/nr-06-atualizada-2025-ii.pdf" target="_blank" rel="noopener">NR-6 no Ministério do Trabalho e Emprego</a>.</small></label></div><div class="form-actions"><a class="btn btn-secondary" href="{{ url_for('admin.index') }}">Voltar</a><button class="btn btn-primary">Salvar configurações</button></div></form>{% endblock %}
